[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defined-compiler"
version = "0.0.1"
description = "Verb language compiler — YAML tasks to BehaviorTree.CPP XML"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "defined-rdf>=0.0.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
defined-compile = "defined_compiler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/defined_compiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
