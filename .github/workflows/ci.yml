name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "defined-rdf @ git+https://github.com/Defined-Robotics/rdf.git@trunk"
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v
