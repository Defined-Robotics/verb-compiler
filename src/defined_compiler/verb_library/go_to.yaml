# Verb definition: go_to
# Navigate to a specific waypoint
name: go_to
description: "Navigate the robot to a specified position"
required_capabilities:
  - differential_drive
  - lidar_2d
template: go_to.xml.j2
primitives:
  - navigate_to_pose
parameters:
  x:
    type: float
    required: true
    description: "Target X coordinate (meters)"
  y:
    type: float
    required: true
    description: "Target Y coordinate (meters)"
  theta:
    type: float
    required: false
    default: 0.0
    description: "Target orientation (radians)"
  timeout:
    type: float
    required: false
    default: 60.0
    description: "Navigation timeout in seconds"
  frame_id:
    type: string
    required: false
    default: "map"
    description: "Reference frame for goal coordinates"
  server_name:
    type: string
    required: false
    default: "/navigate_to_pose"
    description: "Nav2 action server name"
  retries:
    type: int
    required: false
    default: 3
    description: "Number of retry attempts on failure"
output_parameters:
  error_code:
    type: int
    description: "Navigation error code"

# Layer 3: Software dependencies
dependencies:
  apt:
    - ros-jazzy-nav2-bringup
  source:
    - repo: https://github.com/Defined-Robotics/defined-platform
      ref: trunk
      packages: [defined_runtime]

# Layer 4: Runtime configuration
runtime:
  nodes:
    - package: nav2_bringup
      executable: navigation_launch.py
      parameters:
        use_sim_time: true

# Layer 5: Interface contract
interface:
  actions:
    - name: /navigate_to_pose
  topics:
    subscribes: []
    publishes: []
  outputs:
    - error_code
