# Verb definition: report
# Report status or data
name: report
description: "Publish a status report to the monitoring system"
required_capabilities: []
template: report.xml.j2
primitives:
  - publish_status
parameters:
  message:
    type: string
    required: false
    default: "checkpoint"
    description: "Report message"
  topic:
    type: string
    required: false
    default: "/task_reports"
    description: "ROS topic to publish report to"
  level:
    type: string
    required: false
    default: "info"
    description: "Report severity level (debug, info, warn, error)"
output_parameters:
  success:
    type: bool
    description: "Whether report was published"

# Layer 3: Software dependencies
dependencies:
  source:
    - repo: https://github.com/Defined-Robotics/defined-platform
      ref: trunk
      packages: [defined_runtime]

# Layer 4: Runtime configuration
runtime: {}

# Layer 5: Interface contract
interface:
  topics:
    publishes:
      - /task_reports
